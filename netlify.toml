[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Daily cron — runs at 6:00 AM UTC every day
# Triggers the data pipeline to refresh all three strategy snapshots
[[edge_functions]]
  path = "/api/recommendations"

# Headers for API routes
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-store"
